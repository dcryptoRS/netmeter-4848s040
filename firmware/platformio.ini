; NetMeter firmware for the Guition ESP32-4848S040 (4" 480x480 IPS, ESP32-S3
; N16R8, ST7701 RGB panel, GT911 touch, CH340 USB-serial).
;
;   pio run                     build
;   pio run -t upload           build + flash (auto-detects the port)
;
; The build also writes .pio/build/guition_4848s040/firmware.factory.bin: one
; image to flash at offset 0x0 (bootloader + partitions + app). That is the
; file the web installer and the GitHub release ship.

[platformio]
default_envs = guition_4848s040

[env:guition_4848s040]
; pioarduino: Arduino core 3.x, which Arduino_GFX's RGB panel driver needs.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
; N16R8 = 16 MB quad flash + 8 MB octal PSRAM. The panel has no frame memory:
; LCD_CAM re-streams a 460 KB framebuffer out of PSRAM every frame.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
upload_speed = 921600
monitor_speed = 115200

build_flags =
    -DFW_VERSION=\"1.0.0\"
    ; No ARDUINO_USB_CDC_ON_BOOT: the board reaches the PC through a CH340 on
    ; UART0. The S3's native USB pins are not wired to the connector.
    -DLV_CONF_SKIP
    -DLV_COLOR_DEPTH=16
    -DLV_USE_LOG=0
    -DLV_USE_SNAPSHOT=1
    -DLV_USE_QRCODE=1
    ; Built-in symbol font, used only for the settings gear.
    -DLV_FONT_MONTSERRAT_20=1

lib_deps =
    moononournation/GFX Library for Arduino@1.6.7
    lvgl/lvgl@9.5.0
    bblanchon/ArduinoJson@7.4.3
