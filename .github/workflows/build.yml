name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio run -d firmware
      # One image for offset 0x0 (bootloader + partitions + app): what the
      # web installer and the release ship.
      - run: cp firmware/.pio/build/guition_4848s040/firmware.factory.bin netmeter-4848s040.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: netmeter-4848s040.bin

  host-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r host/requirements.txt pytest
      - run: python -m pytest -q host/tests

  # Run the real installers on each OS: venv, dependencies, the `netmeter`
  # command, and (on Windows) the autostart entry and background process.
  installers:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install.sh (Linux / macOS)
        if: runner.os != 'Windows'
        env:
          NETMETER_NO_AUTOSTART: "1"
        run: |
          bash host/install.sh
          ~/.local/bin/netmeter --version
          ~/.local/bin/netmeter status || true
      - name: install-windows.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./host/install-windows.ps1
          & "$env:LOCALAPPDATA\NetMeter\netmeter.cmd" --version
          Start-Sleep 5
          & "$env:LOCALAPPDATA\NetMeter\netmeter.cmd" status
          if ($LASTEXITCODE -ne 0) { throw 'agent not running after install' }
          Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name NetMeter
          & "$env:LOCALAPPDATA\NetMeter\netmeter.cmd" uninstall

  windows-exe:
    needs: host-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r host/requirements.txt pyinstaller
      - run: pyinstaller --onefile --noconsole --name NetMeter host/netmeter.py
      - run: dist/NetMeter.exe --version
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/NetMeter.exe

  pages:
    if: github.ref == 'refs/heads/main'
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, windows-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/netmeter-4848s040.bin
            dist/NetMeter.exe
            host/netmeter.py
            INSTRUCCIONES.txt
